name: Publish to npm

# Push a tag matching package.json's version to publish it:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # `prepare` builds dist/cli.js.
      - run: npm ci
      - run: npm run typecheck

      - name: Smoke test
        run: |
          node dist/cli.js --help > /dev/null
          test "$(node dist/cli.js --version)" = "${GITHUB_REF_NAME#v}"

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
